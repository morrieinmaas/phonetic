name: Bug report
description: Something does not work or measures wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phonetic version
      description: Shown at the bottom of Settings.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Computer
      options:
        - Mac, Apple chip
        - Mac, Intel
        - Linux x86_64 (deb)
        - Linux x86_64 (rpm)
        - Linux x86_64 (AppImage)
        - Linux arm64
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 15.3, Ubuntu 24.04, Fedora 41 ...
  - type: input
    id: interface
    attributes:
      label: Audio interface and sample rate
      placeholder: Focusrite Scarlett 2i2, 48 kHz
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Optional. On Linux, start Phonetic from a terminal and paste what it prints.
      render: text
