# Phonetic Release Pipeline
# Creates releases with changelog on version tags

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target: Apple Silicon
          - platform: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          # Optional: Intel Mac (uncomment if needed)
          # - platform: macos-13
          #   target: x86_64-apple-darwin
          #   name: macos-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: |
          cd apps/desktop/src-tauri && cargo test
          bun test || true

      - name: Build frontend
        run: cd apps/desktop && bun run build

      - name: Build Tauri app (release)
        run: cd apps/desktop && bunx tauri build --target ${{ matrix.target }}

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cp -r apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app release-artifacts/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phonetic-${{ matrix.name }}
          path: release-artifacts/*
          retention-days: 30

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            # Generate changelog from commits
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
            # Escape for GitHub Actions
            CHANGELOG="${CHANGELOG//'%'/'%25'}"
            CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
            CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
            echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Package each platform's artifacts
          for dir in artifacts/*/; do
            platform=$(basename "$dir")
            if [ -d "$dir" ]; then
              # Create zip for .app bundles
              if ls "$dir"/*.app 1> /dev/null 2>&1; then
                cd "$dir"
                zip -r "../../release-assets/${platform}.zip" *.app
                cd ../..
              fi
              # Copy DMG files directly
              if ls "$dir"/*.dmg 1> /dev/null 2>&1; then
                cp "$dir"/*.dmg release-assets/
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Phonetic ${{ github.ref_name }}
          body: |
            ## Phonetic ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            - **macOS (Apple Silicon)**: Download the `.dmg` file for easy installation
            - **macOS (App Bundle)**: Download the `.zip` for the raw application bundle

            ### Requirements
            - macOS 11.0+ (Apple Silicon optimized)

            ### Installation
            1. Download the `.dmg` file
            2. Open and drag Phonetic to Applications
            3. Grant microphone access when prompted
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
