# Phonetic Release Pipeline
# Builds installers for every supported OS/arch on a version tag and
# publishes a GitHub Release with a changelog.
#
# macOS builds are ad-hoc signed (bundle.macOS.signingIdentity = "-" in
# tauri.conf.json), not Developer ID signed or notarised. Gatekeeper will ask
# the user to approve the first launch; the release notes below explain how.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: ubuntu-22.04-arm
            name: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 is the oldest base that ships WebKitGTK 4.1, which keeps
      # the glibc requirement of the .deb/.rpm/.AppImage as low as possible.
      - name: Install Tauri Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: cd apps/desktop && bun run build

      - name: Run tests
        run: |
          cd apps/desktop/src-tauri && cargo test
          cd ../ && bun test

      - name: Build Tauri app (release)
        run: cd apps/desktop && bunx tauri build

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          B=apps/desktop/src-tauri/target/release/bundle
          for f in "$B"/dmg/*.dmg "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage; do
            [ -e "$f" ] && cp "$f" release-artifacts/
          done
          # tauri build compiles every bin target, so the headless CLI is already there
          cp apps/desktop/src-tauri/target/release/phonetic-cli "release-artifacts/phonetic-cli-${{ matrix.name }}"
          ls -la release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phonetic-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Phonetic ${{ github.ref_name }}
          body: |
            ## Phonetic ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            | Platform | File |
            |---|---|
            | macOS, Apple Silicon | `Phonetic_*_aarch64.dmg` |
            | macOS, Intel | `Phonetic_*_x64.dmg` |
            | Linux x86_64 | `*_amd64.deb`, `*.x86_64.rpm`, `*_amd64.AppImage` |
            | Linux arm64 | `*_arm64.deb`, `*.aarch64.rpm`, `*_aarch64.AppImage` |
            | Headless CLI | `phonetic-cli-<platform>` (single binary; `chmod +x` it) |

            ### Installing on macOS
            Phonetic is not signed with an Apple Developer ID, so macOS blocks
            the first launch. This is expected; the build is reproducible from
            the tagged source in this repository.

            1. Open the `.dmg` and drag Phonetic to Applications.
            2. Double-click Phonetic. macOS reports it cannot verify the app. Click **Done**.
            3. Open **System Settings → Privacy & Security**, scroll to **Security**,
               and click **Open Anyway** next to Phonetic. Confirm with your password or Touch ID.
            4. Launch Phonetic again and grant microphone access when asked.

            Terminal alternative to steps 2 and 3:
            `xattr -dr com.apple.quarantine /Applications/Phonetic.app`

            ### Installing on Linux
            - Debian/Ubuntu: `sudo apt install ./Phonetic_*.deb`
            - Fedora/RHEL: `sudo dnf install ./Phonetic-*.rpm`
            - Any distro: `chmod +x Phonetic_*.AppImage && ./Phonetic_*.AppImage`

            Requires WebKitGTK 4.1 (Ubuntu 22.04+, Debian 12+, Fedora 36+).
            Audio runs through ALSA; PipeWire and PulseAudio work via their ALSA layer.
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
