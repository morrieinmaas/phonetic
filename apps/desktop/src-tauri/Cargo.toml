[package]
name = "phonetic"
version = "0.1.0"
description = "Modern audio measurement system"
authors = ["Moritz"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "phonetic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio I/O
cpal = "0.15"

# DSP
realfft = "3"

# Lock-free data structures
ringbuf = "0.4"

# Better synchronization primitives
parking_lot = "0.12"

# Random number generation (for noise)
rand = { version = "0.8", features = ["small_rng"] }

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# Direct CoreAudio access for lower latency than CPAL abstraction
coreaudio-rs = "0.12"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dsp_benchmarks"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
