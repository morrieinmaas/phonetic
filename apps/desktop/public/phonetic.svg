<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#1a1a2e"/>
  <g transform="translate(15, 25)">
    <!-- Spectrum bars -->
    <rect x="0" y="35" width="8" height="15" fill="url(#grad)" rx="2"/>
    <rect x="12" y="25" width="8" height="25" fill="url(#grad)" rx="2"/>
    <rect x="24" y="10" width="8" height="40" fill="url(#grad)" rx="2"/>
    <rect x="36" y="5" width="8" height="45" fill="url(#grad)" rx="2"/>
    <rect x="48" y="15" width="8" height="35" fill="url(#grad)" rx="2"/>
    <rect x="60" y="30" width="8" height="20" fill="url(#grad)" rx="2"/>
  </g>
</svg>
